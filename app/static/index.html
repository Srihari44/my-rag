<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floodlight — Ask the archive</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="wordmark">
        <span class="wordmark__text">FLOODLIGHT</span>
        <span class="wordmark__rule" aria-hidden="true"></span>
      </div>
      <div class="status" id="status" data-state="checking">
        <span class="status__dot" aria-hidden="true"></span>
        <span class="status__label" id="statusLabel">Checking&hellip;</span>
      </div>
    </header>

    <div class="layout">
      <button class="archive-toggle" id="archiveToggle" aria-expanded="false" aria-controls="archive">
        <span>Archive</span>
        <span class="archive-toggle__count" id="archiveToggleCount">0</span>
      </button>

      <aside class="archive" id="archive">
        <div class="archive__head">
          <h2 class="archive__title">Archive</h2>
          <span class="archive__count" id="archiveCount">0 files</span>
        </div>

        <ol class="doc-list" id="docList" aria-live="polite"></ol>
        <p class="doc-empty" id="docEmpty" hidden>No documents indexed yet. Add a PDF below to begin.</p>

        <div class="upload" id="upload">
          <input type="file" id="fileInput" accept="application/pdf" class="upload__input" hidden />
          <div class="upload__zone" id="uploadZone" tabindex="0" role="button" aria-label="Add a PDF to the archive">
            <span class="upload__label">Add to archive</span>
            <span class="upload__hint" id="uploadHint">Drop a PDF, or click to browse</span>
          </div>
          <div class="upload__progress" id="uploadProgress" hidden>
            <div class="upload__bar"><div class="upload__fill" id="uploadFill"></div></div>
            <span class="upload__status" id="uploadStatus">Uploading&hellip;</span>
          </div>
        </div>
      </aside>

      <main class="session">
        <div class="transcript" id="transcript">
          <div class="empty-state" id="emptyState">
            <h1 class="empty-state__title">Ask the archive.</h1>
            <p class="empty-state__body">
              Floodlight answers strictly from what's indexed above &mdash; nothing invented,
              every claim traceable to a source.
            </p>
            <div class="empty-state__suggestions" id="suggestions" aria-label="Example questions"></div>
          </div>
        </div>

        <form class="composer" id="composerForm">
          <label class="composer__label" for="composerInput">Query</label>
          <textarea
            id="composerInput"
            class="composer__input"
            placeholder="Ask about the archive&hellip;"
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="composer__send" id="composerSend">
            <span>Ask</span>
            <span aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </main>
    </div>
  </div>

  <template id="turnTemplate">
    <article class="turn">
      <div class="turn__query">
        <span class="turn__label turn__label--query"><span class="turn__index"></span> Query</span>
        <p class="turn__question"></p>
      </div>
      <div class="turn__answer">
        <span class="turn__label turn__label--answer">Answer</span>
        <div class="turn__body">
          <div class="turn__scanning">
            <span class="turn__scanning-bar"></span>
            <span class="turn__scanning-text">Scanning the archive&hellip;</span>
          </div>
        </div>
        <div class="turn__sources" hidden></div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
